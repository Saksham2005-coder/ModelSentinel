[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelsentinel-cli"
version = "0.1.0"
description = "ModelSentinel Engineering CLI"
dependencies = [
    "typer>=0.9.0",
    "requests>=2.25.1",
    "rich>=13.0.0"
]
requires-python = ">=3.9"

[project.scripts]
modelsentinel = "modelsentinel.main:run"

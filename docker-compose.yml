version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-modelsentinel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-modelsentinel_password}
      - POSTGRES_DB=${POSTGRES_DB:-modelsentinel}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelsentinel} -d ${POSTGRES_DB:-modelsentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-modelsentinel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-modelsentinel_password}
      - POSTGRES_DB=${POSTGRES_DB:-modelsentinel}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:5173", "http://localhost", "http://127.0.0.1"]}
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
